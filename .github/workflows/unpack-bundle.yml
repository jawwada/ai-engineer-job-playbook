name: unpack-bundle
on:
  push:
    paths:
      - bundle.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle.zip into the repository
        run: |
          if [ ! -f bundle.zip ]; then echo "no bundle.zip"; exit 0; fi
          unzip -o bundle.zip -d .
          rm -f bundle.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack bundle.zip" || echo "nothing to commit"
          git push
