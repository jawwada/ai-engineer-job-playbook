  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;client-facing-map&#x27;);
      const situations = {

          steps: [&#x27;Ask how the data will be used, evaluated, and where the model fails.&#x27;, &#x27;Prototype representative and edge cases; let the client score them.&#x27;, &#x27;Agree the rubric, metric, sampling, adjudication, and change rule.&#x27;],
          say: &#x27;“Before we scale, what behavior must this data improve, how will you measure it, and which failures are unacceptable? I’ll bring a small sample and rubric so we can align on examples.”&#x27;,

          steps: [&#x27;Decide whether feedback clarifies or changes the target.&#x27;, &#x27;Pause only the affected path and preserve accepted work.&#x27;, &#x27;Test the revised spec, quantify rework, and obtain approval.&#x27;],
          say: &#x27;“This changes acceptance, not just wording. Let’s keep v1, test v2 on a sample, and quantify rework, date, and cost before restarting.”&#x27;,

        scope: {

          watch: &#x27;If scope, date, and budget are all declared fixed, document the infeasible triangle and involve the accountable sponsor.&#x27;, avoid: &#x27;Quietly accepting work that makes the promise unrealistic.&#x27;
        },
        status: {
          title: &#x27;Long project feels stalled&#x27;, technique: &#x27;Make progress visible through a predictable outcome-and-decision cadence.&#x27;, tag: &#x27;Progress visibility&#x27;, evidence: &#x27;EXPERIENCE-GROUNDED PLAYBOOK&#x27;,
          steps: [&#x27;Report what shipped, what is at risk, and what decision is needed.&#x27;, &#x27;Show a leading artifact or metric before the final result exists.&#x27;, &#x27;Keep technical detail in a separate engineering review.&#x27;],
          say: &#x27;“Green: [shipped]. Watch: [risk and trigger]. Need: [decision]. Next visible proof is [artifact] on [day], and I’ll update you then regardless.”&#x27;,
          example: { situation: &#x27;Ahmed led E.ON’s AI portfolio and a 15-person team through long delivery cycles.&#x27;, action: &#x27;Separate sponsor-level outcomes and decisions from engineering detail.&#x27;, result: &#x27;Use this as evidence of senior portfolio leadership; verify any claimed meeting cadence.&#x27; },
          watch: &#x27;If missing client decisions repeatedly block work, show the accumulated date impact and name the required owner.&#x27;, avoid: &#x27;Reporting activity without outcomes, risk, or a decision request.&#x27;
        },
        escalate: {
          title: &#x27;Escalation is needed&#x27;, technique: &#x27;Escalate the decision, not the ownership.&#x27;, tag: &#x27;Owned escalation&#x27;, evidence: &#x27;SOURCE-DOCUMENTED PLAYBOOK&#x27;,
          steps: [&#x27;Check whether the issue crosses contract, account, security, compliance, or pricing authority.&#x27;, &#x27;Contain impact and prepare facts, options, recommendation, and deadline.&#x27;, &#x27;Bring in the right authority while remaining client-facing owner.&#x27;],
          say: &#x27;“This changes contractual acceptance, so I should not decide it alone. Here are the facts, options, and my recommendation. I’m involving the Client Director and will return by [time].”&#x27;,
          example: { situation: &#x27;A client asks to change quality acceptance without changing delivery terms.&#x27;, action: &#x27;The Solution Owner quantifies impact and brings the decision—not the problem—to the Client Director.&#x27;, result: &#x27;The right authority decides while the client experiences continuity.&#x27; },

        },

        qualitydispute: {
          title: &#x27;Client rejects a batch&#x27;, technique: &#x27;Pause the affected line and adjudicate against shared evidence.&#x27;, tag: &#x27;Quality dispute&#x27;, evidence: &#x27;ILLUSTRATIVE SCRIPT&#x27;,
          steps: [&#x27;Stop compounding the affected output.&#x27;, &#x27;Blind-score accepted, rejected, and borderline units against the rubric.&#x27;, &#x27;Separate execution defects, ambiguity, and changed expectations; agree rework.&#x27;],
          say: &#x27;“I’m pausing the affected line. Let’s jointly score a blind sample and separate our miss, rubric ambiguity, and changed expectation. I’ll own confirmed defects.”&#x27;,
          example: { situation: &#x27;A client rejects preference labels that internal QA accepted.&#x27;, action: &#x27;Joint adjudication identifies annotator errors, ambiguous rules, and genuinely new preferences.&#x27;, result: &#x27;Defects are reworked, the rubric improves, and production restarts on one shared bar.&#x27; },
          watch: &#x27;If rework or spec change remains disputed, take the evidence, cost, and recommendation to the Client Director.&#x27;, avoid: &#x27;Defending or conceding the whole batch before adjudication.&#x27;
        },
        pushback: {
          title: &#x27;Push back on a risky request&#x27;, technique: &#x27;Support the goal, explain the consequence, and offer a safer path.&#x27;, tag: &#x27;Principled pushback&#x27;, evidence: &#x27;EXPERIENCE-GROUNDED PLAYBOOK&#x27;,
          steps: [&#x27;Name the outcome you support.&#x27;, &#x27;Explain the specific business risk.&#x27;, &#x27;Offer a safer alternative and document ownership.&#x27;],
          say: &#x27;“I support the turnaround goal. Removing review from compliance-sensitive content creates a larger downside. Let’s automate low-risk cases and review only flagged ones.”&#x27;,
          example: { situation: &#x27;Capital Group verifies regulated workflows and HITL, not an actual demand to remove review.&#x27;, action: &#x27;Use risk-based automation, required-disclosure checks, traceability, and targeted approval.&#x27;, result: &#x27;Most speed is preserved while material risk remains controlled.&#x27; },
          watch: &#x27;If the client insists, involve the accountable risk owner and Client Director before implementation.&#x27;, avoid: &#x27;A flat “no” or silently implementing a risk you advised against.&#x27;
        },
        failedapproach: {
          title: &#x27;My recommended approach failed&#x27;, technique: &#x27;Own the hypothesis, retire it with evidence, and propose a bounded next test.&#x27;, tag: &#x27;Evidence over ego&#x27;, evidence: &#x27;EXPERIENCE-GROUNDED PLAYBOOK&#x27;,
          steps: [&#x27;Lead with the result against the agreed bar.&#x27;, &#x27;State what the evidence changed.&#x27;, &#x27;Recommend the next path, cost, and decision point.&#x27;],
          say: &#x27;“My recommendation did not clear the bar: [X] versus [Y]. I own it. The evidence shows [learning], so I recommend [B] and a bounded comparison by [time].”&#x27;,
          example: { situation: &#x27;A retrieval configuration misses the required grounding precision.&#x27;, action: &#x27;Present the failed metric, error analysis, and focused alternative.&#x27;, result: &#x27;The client sees scientific judgment, not attachment to sunk cost.&#x27; },
          watch: &#x27;Escalate only if the replacement changes committed scope, quality, price, or account risk.&#x27;, avoid: &#x27;Defending the original reasoning or softening the metric after failure.&#x27;
        },
        disagree: {
          title: &#x27;Technical disagreement&#x27;, technique: &#x27;Let a pre-agreed, reversible test decide.&#x27;, tag: &#x27;Evidence over ego&#x27;, evidence: &#x27;EXPERIENCE-GROUNDED PLAYBOOK&#x27;,
          steps: [&#x27;State both approaches and trade-offs fairly.&#x27;, &#x27;Agree the metric, test set, time box, and rollback rule.&#x27;, &#x27;Support the result, even when it favors the client.&#x27;],
          say: &#x27;“Yours is faster; mine should reduce [failure]. I may be wrong. Let’s test both on the same cases, agree the metric now, and let the result decide.”&#x27;,
          example: { situation: &#x27;Prompt-only context competes with retrieval plus evaluation gates.&#x27;, action: &#x27;Compare quality, latency, cost, and recovery on one hard-case set.&#x27;, result: &#x27;The choice gains evidence and neither party has to lose face.&#x27; },
          watch: &#x27;If the test cannot resolve a strategic or irreversible choice, bring the evidence to the named owner.&#x27;, avoid: &#x27;Winning the argument, cherry-picking, or changing the metric later.&#x27;

        margin: {
          title: &#x27;Cost per accepted unit is rising&#x27;, technique: &#x27;Optimize accepted-unit economics, not total activity.&#x27;, tag: &#x27;Unit economics&#x27;, evidence: &#x27;EXPERIENCE-GROUNDED PLAYBOOK&#x27;,

          example: { situation: &#x27;Toloka’s example is five expert hours on a unit priced for three.&#x27;, action: &#x27;Find the costly station, reduce routine effort, and measure quality with cost.&#x27;, result: &#x27;Automation restores margin without removing expert judgment.&#x27; },
          watch: &#x27;The Solution Owner acts first; involve the Client Director only when price or account authority is needed.&#x27;, avoid: &#x27;Watching aggregate spend or waiting until margin is already lost.&#x27;

        tradeoff: {
          title: &#x27;Quality, time, and budget conflict&#x27;, technique: &#x27;Spend stronger models or human review only where they change the outcome.&#x27;, tag: &#x27;Pragmatic delivery&#x27;, evidence: &#x27;DOCUMENTED EXPERIENCE&#x27;,
          steps: [&#x27;Define the quality floor and business outcome.&#x27;, &#x27;Segment easy, uncertain, and high-risk cases.&#x27;, &#x27;Use the cheapest reliable path; reduce scope before quality.&#x27;],

          example: { situation: &#x27;Ahmed’s recent exercise balanced accuracy, latency, and API cost.&#x27;, action: &#x27;He made the budget constraint visible and targeted expensive capability where it mattered.&#x27;, result: &#x27;The design optimized cost per accepted outcome, not one isolated metric.&#x27; },
          watch: &#x27;If the client will not choose among explicit options, ask the sponsor to accept the trade-off before commitment.&#x27;, avoid: &#x27;Gold-plating or hiding cost and latency consequences.&#x27;

        expand: {
          title: &#x27;You spot adjacent client value&#x27;, technique: &#x27;Link adjacent pain to assets already built and propose a reversible proof.&#x27;, tag: &#x27;Commercial curiosity&#x27;, evidence: &#x27;DOCUMENTED EXPERIENCE&#x27;,

          example: { situation: &#x27;E.ON documents four production systems; Xiom.AI covered inventory, pricing, forecasting, and replenishment.&#x27;, action: &#x27;Frame adjacent use cases in cost, stock, revenue, or risk—not novelty.&#x27;, result: &#x27;Verified outcomes include 25% lower Optiheat cloud cost and $1.5M Xiom.AI value.&#x27; },
          watch: &#x27;Keep the idea outside current scope until approved; involve the Client Director when account terms change.&#x27;, avoid: &#x27;Selling before delivering or expanding without a business metric.&#x27;
        }
      };

      const title = root.querySelector(&#x27;#detail-title&#x27;);
      const technique = root.querySelector(&#x27;#detail-technique&#x27;);
      const tag = root.querySelector(&#x27;#detail-tag&#x27;);
      const steps = root.querySelector(&#x27;#detail-steps&#x27;);
      const say = root.querySelector(&#x27;#detail-say&#x27;);
      const example = root.querySelector(&#x27;#detail-example&#x27;);
      const evidence = root.querySelector(&#x27;#detail-evidence&#x27;);
      const watch = root.querySelector(&#x27;#detail-watch&#x27;);
      const avoid = root.querySelector(&#x27;#detail-avoid&#x27;);
      const buttons = Array.from(root.querySelectorAll(&#x27;.situation&#x27;));

      function exampleLine(label, copy) {
        const paragraph = document.createElement(&#x27;p&#x27;);
        const lead = document.createElement(&#x27;strong&#x27;);
        lead.textContent = label + &#x27; &#x27;;
        paragraph.append(lead, document.createTextNode(copy));
        return paragraph;
      }

      function render(key, save) {
        const item = situations[key] || situations.fuzzy;
        title.textContent = item.title;
        technique.textContent = item.technique;
        tag.textContent = item.tag;
        steps.replaceChildren(...item.steps.map((step) =&gt; {
          const li = document.createElement(&#x27;li&#x27;);
          li.textContent = step;
          return li;
        }));
        say.textContent = item.say;
        evidence.textContent = item.evidence;
        example.replaceChildren(
          exampleLine(&#x27;Situation.&#x27;, item.example.situation),
          exampleLine(&#x27;Action.&#x27;, item.example.action),
          exampleLine(&#x27;Result / interview use.&#x27;, item.example.result)
        );
        watch.textContent = item.watch;
        avoid.textContent = item.avoid;
        buttons.forEach((button) =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.key === key)));
        if (save &amp;&amp; window.openai &amp;&amp; window.openai.setWidgetState) {
          window.openai.setWidgetState({ modelContent: { selectedSituation: key }, privateContent: null }).catch(() =&gt; {});
        }
      }

      buttons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.key, true)));
      const initial = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.modelContent
        ? window.openai.widgetState.modelContent.selectedSituation
        : &#x27;fuzzy&#x27;;
      render(initial, false);
      window.addEventListener(&#x27;openai:set_globals&#x27;, (event) =&gt; {
        const next = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState &amp;&amp; event.detail.globals.widgetState.modelContent
          ? event.detail.globals.widgetState.modelContent.selectedSituation
          : null;
        if (next &amp;&amp; situations[next]) render(next, false);
      });
    })();
  &lt;/script&gt;

&lt;script&gt;

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;

      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
